# Bitácora: 2026-08-30 - Empaquetado mínimo y configuración profesional de pruebas.
[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-pdf-translator"
version = "0.1.0"
description = "Pipeline gobernado de extracción, traducción y renderizado documental."
readme = "README.md"
requires-python = ">=3.14,<3.15"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-config", "--strict-markers", "-ra"]
markers = [
  "integration: comprueba integración con archivos PDF o recursos externos al test unitario",
]

[tool.coverage.run]
branch = true
source = ["lab_pdf_translator"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
